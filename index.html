        *::before,
        *::after {

            padding: 0;
            box-sizing: border-box;

        }

        body.dark .card {

            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);

        body.dark .search-input {
            background: #1f1f2e;
            color: #e8e8f0;
            border-color: #3a3a50;

            color: #e8e8f0;

            color: #f0c040;

        }

            background: #2f2f42;

        body.dark .badge {
            background: #2d2d44;
            color: #c0c0d8;

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-text span {
            font-size: 0.9rem;
            font-weight: 400;
            color: #8888aa;
            display: block;
            margin-top: -2px;

            gap: 8px;

            color: #1e1e2f;

            align-items: center;
            gap: 8px;

            border-color: #6c5ce7;
            color: #fff;

            min-width: 120px;
            color: #1e1e2f;

            letter-spacing: 0.3px;
            color: #6c5ce7;

            font-size: 0.8rem;
            font-weight: 600;

            color: #fff;
        }

        .vote-btn i {
            font-size: 1rem;
        }

        .social-links {
            display: flex;
            gap: 6px;
            margin-left: auto;
        }

        .social-link {

            height: 34px;
            border-radius: 40px;
            background: #f0f2f8;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555577;
            transition: all 0.2s;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .social-link:hover {
            background: #6c5ce7;
            color: #fff;

        .social-link.tiktok:hover {

        .social-link.twitter:hover {
            background: #1da1f2;
        }
        .social-link.twitch:hover {

            font-weight: 600;
            color: #555577;

        /* ── Responsive ── */

            .header {

                align-items: stretch;
                gap: 12px;
            }

            .logo-area {
                justify-content: center;
            }

            .header-actions {
                justify-content: center;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-group {
                justify-content: center;
            }

            .search-box {
                width: 100%;
            }

            .sort-select {
                width: 100%;
            }

            .grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
                gap: 18px;
            }

            .card-body {
                padding: 16px;
            }

            .stats-badge {
                font-size: 0.8rem;
                padding: 6px 16px;
            }
        }

        @media (max-width: 480px) {
            .grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }

            .card-body {
                padding: 12px;
            }

            .creator-name {
                font-size: 1rem;
            }

            .filter-btn {
                font-size: 0.75rem;
                padding: 6px 14px;
            }

            .vote-btn {
                font-size: 0.75rem;
                padding: 6px 12px;
            }

            .social-link {
                width: 28px;
                height: 28px;
                font-size: 0.75rem;
            }

            .card-meta {
                gap: 10px;
                font-size: 0.7rem;
            }

            .logo-text h1 {
                font-size: 1.4rem;
            }

            .logo-icon {
                width: 44px;
                height: 44px;
                font-size: 1.6rem;
            }
        }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #e8ecf4;
        }
        ::-webkit-scrollbar-thumb {
            background: #6c5ce7;
            border-radius: 40px;
        }
        body.dark ::-webkit-scrollbar-track {
            background: #1f1f2e;
        }
        body.dark ::-webkit-scrollbar-thumb {
            background: #6c5ce7;
        }
    </style>
</head>

        function render() {
            // Filter
            let filtered = creators.filter(c => {
                const matchCategory = currentFilter === 'all' || c.category === currentFilter;
                const matchSearch = c.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    c.handle.toLowerCase().includes(searchQuery.toLowerCase());
                return matchCategory && matchSearch;
            });

            // Sort
            if (sortBy === 'votes') {
                filtered.sort((a, b) => b.votes - a.votes);
            } else if (sortBy === 'name') {
                filtered.sort((a, b) => a.name.localeCompare(b.name));
            } else if (sortBy === 'newest') {
                filtered.sort((a, b) => b.id - a.id);
            }

            currentData = filtered;

            // Total votes
            const totalVotes = creators.reduce((sum, c) => sum + c.votes, 0);
            totalVotesDisplay.textContent = formatNumber(totalVotes);

            if (filtered.length === 0) {
                grid.innerHTML = `
                <div class="no-results">
                  <i class="fas fa-search"></i>
                  <h3>No creators found</h3>
                  <p style="margin-top:6px; color:#aaaac0;">Try a different filter or search term</p>
                </div>
              `;
                return;
            }

            grid.innerHTML = filtered.map(c => {
                const voted = votedIds.has(c.id);
                const verifiedIcon = c.verified ? <i class="fas fa-check-circle verified-badge"></i> : '';

                // Build social links
                const socialHtml = Object.entries(c.socials).map(([platform, url]) =>
                    <a href="${url}" target="_blank" class="${getSocialClass(platform)}" aria-label="${platform}"><i class="${getSocialIcon(platform)}"></i></a>
                ).join('');

                return `
                <div class="card" data-id="${c.id}">
                  <img class="card-image" src="${c.image}" alt="${c.name}" loading="lazy" />
                  <div class="card-body">
                    <div class="card-top">
                      <div class="creator-info">
                        <div class="creator-name">
                          ${c.name} ${verifiedIcon}
                        </div>
                        <div class="creator-handle">${c.handle}</div>
                      </div>
                      <span class="category-badge">${getCategoryIcon(c.category)} ${c.category}</span>
                    </div>

                    <div class="card-meta">
                      <span class="stat-item"><i class="fas fa-heart" style="color:#ff6b8a;"></i> <span class="stat-value" id="voteCount-${c.id}">${formatNumber(c.votes)}</span></span>
                      <span class="stat-item"><i class="fas fa-hashtag" style="color:#6c5ce7;"></i> ${c.handle}</span>
                    </div>

                    <div class="card-actions">
                      <button class="vote-btn ${voted ? 'voted' : ''}" data-id="${c.id}">
                        <i class="fas fa-arrow-up"></i> ${voted ? 'Voted' : 'Vote'}
                      </button>
                      <div class="social-links">
                        ${socialHtml}
                      </div>
                    </div>
                  </div>
                </div>
              `;
            }).join('');

            // Re-bind vote events
            document.querySelectorAll('.vote-btn').forEach(btn => {
                btn.addEventListener('click', handleVote);
            });
        }

        // ─── VOTE HANDLER ──────────────────────────────────────────
        function handleVote(e) {
            const btn = e.currentTarget;
            const id = parseInt(btn.dataset.id);
            if (votedIds.has(id)) return; // already voted

            const creator = creators.find(c => c.id === id);
            if (!creator) return;

            creator.votes += 1;
            votedIds.add(id);

            // Update UI
            const countSpan = document.getElementById(voteCount-${id});
            if (countSpan) countSpan.textContent = formatNumber(creator.votes);

            btn.classList.add('voted');
            btn.innerHTML = '<i class="fas fa-arrow-up"></i> Voted';

            // Update total votes
            const total = creators.reduce((sum, c) => sum + c.votes, 0);
            totalVotesDisplay.textContent = formatNumber(total);

            // Re-sort if currently sorting by votes
            if (sortBy === 'votes') {
                render(); // re-render to reorder
            }

            // subtle feedback
            btn.style.transform = 'scale(0.94)';
            setTimeout(() => { btn.style.transform = ''; }, 150);
        }

        // ─── FILTER ────────────────────────────────────────────────
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                render();
            });
        });

        // ─── SEARCH ────────────────────────────────────────────────
        searchInput.addEventListener('input', () => {
            searchQuery = searchInput.value.trim();
            clearSearch.classList.toggle('visible', searchQuery.length > 0);
            render();
        });

        clearSearch.addEventListener('click', () => {
            searchInput.value = '';
            searchQuery = '';
            clearSearch.classList.remove('visible');
            render();
            searchInput.focus();
        });

        // ─── SORT ──────────────────────────────────────────────────
        sortSelect.addEventListener('change', () => {
            sortBy = sortSelect.value;
            render();
        });

        // ─── THEME ──────────────────────────────────────────────────
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            themeLabel.textContent = isDark ? 'Light' : 'Dark';
            themeToggle.innerHTML = <i class="fas ${isDark ? 'fa-sun' : 'fa-moon'}"></i> <span id="themeLabel">${isDark ? 'Light' : 'Dark'}</span>;
        });

        // ─── INIT ──────────────────────────────────────────────────
        render();
    </script>
</body>
</html>
